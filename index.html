<style>

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  /* ---------- 首页 ---------- */
  .hero{text-align:center;padding:26px 8px 18px}
  .hero .emoji{font-size:54px;line-height:1}
  .hero h1{font-size:25px;line-height:1.45;margin:14px 4px 8px;font-weight:800}
  .hero h1 .hl{color:var(--acc)}
  .hero .sub{font-size:14px;color:var(--sub);margin-bottom:18px;line-height:1.7}
  .tags{display:flex;flex-direction:column;gap:9px;margin:6px 4px 20px}
  .tag{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;text-align:left;
    box-shadow:0 2px 10px rgba(125,91,224,.10);border:1px solid var(--line)}
  .tag b{color:var(--acc)}
  .btn{display:block;width:100%;padding:16px;border:none;border-radius:999px;font-size:18px;font-weight:700;
    color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2));cursor:pointer;
    box-shadow:0 6px 18px rgba(125,91,224,.30);letter-spacing:2px}
  .btn:active{transform:scale(.97)}
  .footnote{text-align:center;font-size:12px;color:#b3a7cc;margin-top:14px;line-height:1.7}
  .deco{margin-top:22px;font-size:13px;color:#c5b8dd;text-align:center;line-height:1.9}

  /* ---------- 答题 ---------- */
  .bar{height:8px;background:#dcd2f3;border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .3s}
  .count{text-align:right;font-size:12px;color:var(--sub);margin-bottom:10px}
  .q{background:var(--card);border-radius:18px;padding:20px 16px;font-size:17px;font-weight:700;line-height:1.6;
    box-shadow:0 4px 14px rgba(125,91,224,.12);margin-bottom:16px}
  .q .num{display:inline-block;font-size:12px;font-weight:600;color:#fff;background:var(--acc2);
    border-radius:99px;padding:3px 10px;margin-bottom:10px}
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:14px 15px;font-size:15px;
    line-height:1.55;text-align:left;cursor:pointer;transition:.15s;color:var(--ink)}
  .opt:active{background:var(--bg1);border-color:var(--acc);transform:scale(.98)}

  /* ---------- 结果 ---------- */
  .result{text-align:center;padding-top:22px}
  .result .emoji{font-size:56px}
  .result .name{font-size:24px;font-weight:800;color:var(--acc);margin-top:10px}
  .result .tagline{font-size:15px;color:var(--gold);margin-top:6px;font-weight:700}
  .card{background:var(--card);border-radius:18px;padding:18px 16px;text-align:left;margin-top:16px;
    box-shadow:0 4px 14px rgba(125,91,224,.12);font-size:14px;line-height:1.85}
  .card h3{font-size:13px;color:var(--acc);margin-bottom:8px;letter-spacing:1px}
  .card.fix{border-left:4px solid var(--gold)}
  .card.fix h3{color:var(--gold)}
  .stat{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.7}
  .share{margin-top:16px;padding:14px;border:none;border-radius:999px;font-size:15px;font-weight:700;
    color:var(--acc);background:#fff;border:1.5px solid var(--acc);cursor:pointer;width:100%}
  .again{margin-top:10px}
  .hidden{display:none}
  @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .35s ease}
</style>
</head>

</div>

  ["TA在雨里递过来的那把伞","E"],
  ["合唱到跑调的一整场","D"],
  ["路过庙里TA硬塞给你的护身符","G"]],
 ["给十年后的自己存一样东西，你存：",
  ["一封信","A"],
  ["一罐按年份攒起来的星星","B"],
  ["一沓票根和照片","C"],
  ["一枚今年的硬币","G"]],
 ["你挑随身物件的标准：",
  ["背后有故事","C"],
  ["轻巧，能不离身","H"],
  ["看一眼心里就暖","E"],
  ["旧一点才好","J"]],
 ["对方随口说想吃一样东西，你会：",
  ["当天就带TA去吃","I"],
  ["偷偷记着，攒到纪念日一起","B"],
  ["看哪天路过，刚好就买","G"],
  ["立刻出门去买","F"]],
 ["你觉得浪漫最怕：",
  ["聊得再多，却没一起听过一首歌","D"],
  ["贵重，却从不贴身","H"],
  ["轰轰烈烈，转瞬即逝","F"],
  ["按部就班，没有一点意外","G"]],
 ["深夜对方发来「睡不着」，你会：",
  ["陪TA聊到睡着","D"],
  ["煮碗夜宵送过去","I"],

 ["你想对另一半说：",

  ["冬天给我织点什么吧","E"]],
 ["用一个词形容你的浪漫：",
  ["郑重","A"],
  ["攒","B"],
  ["记得","I"],
  ["同频","D"]]
];

let idx = 0, score = {};
const $ = id => document.getElementById(id);

function start(){
  idx = 0; score = {};
  $("home").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  render();
}
function render(){
  const q = QS[idx];
  $("qnum").textContent = "第 " + (idx+1) + " 题";
  $("qtext").textContent = q[0];
  $("cnow").textContent = idx+1;
  $("pbar").style.width = (idx/32*100) + "%";
  const box = $("opts"); box.innerHTML = "";
  q.slice(1).forEach(([text,key])=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = text;
    b.onclick = ()=>pick(key);
    box.appendChild(b);
  });
  window.scrollTo(0,0);
}
function pick(key){
  score[key] = (score[key]||0) + 1;
  idx++;
  if(idx < QS.length) render(); else show();
}
function show(){
  $("quiz").classList.add("hidden");
  $("res").classList.remove("hidden");
  const order = ["A","B","C","D","E","F","G","H","I","J"];
  let best = order[0];
  order.forEach(k=>{ if((score[k]||0) > (score[best]||0)) best = k; });
  const t = TYPES[best];
  $("remoji").textContent = t.e;
  $("rname").textContent = t.n;
  $("rtag").textContent = "—— " + t.t + " ——";
  $("rbody").textContent = t.b;
  $("rstep").textContent = t.s;
  $("rwarn").textContent = t.w;
  const sorted = order.map(k=>[k,score[k]||0]).sort((a,b)=>b[1]-a[1]);
  const second = TYPES[sorted[1][0]];
  $("rstat").textContent = "次高信物：" + second.n + "（" + second.t + "）· 32 题答完，" + (score[best]||0) + " 题指向这个信物。信物不分贵贱，能替你记住心意的那件，就是本命。";
  $("res").dataset.text = "我在「测一测，专属于你的本命浪漫信物」里测出了【" + t.n + "】："
    + t.t + "。" + t.s + " 来测测你的信物 →";
  window.scrollTo(0,0);
}
function copyRes(){
  const text = $("res").dataset.text;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert("已复制，去评论区晒信物吧 👀"));
  }else{
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    alert("已复制，去评论区晒信物吧 👀");
  }
}
</script>
